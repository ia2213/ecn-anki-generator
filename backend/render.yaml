services:
  - type: web
    name: ecn-anki-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: FRONTEND_URL
        value: https://ecn-anki-generator.vercel.app
    healthCheckPath: /health
